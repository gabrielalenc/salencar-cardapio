<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>window.__salencarSplashStartedAt = performance.now();</script>
    <link rel="icon" type="image/jpeg" href="/images/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salencar Batidas Artesanais | Delivery de Bebidas</title>
    <meta name="description" content="Peça as melhores batidas artesanais da Salencar! Morango, Maracujá, Espanhola e muito mais. Entrega rápida e geladinha no seu conforto." />
    <meta name="theme-color" content="#70283F" />
    <link rel="preload" as="image" href="/images/logo.jpg" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      .startup-splash{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;overflow:hidden;padding:24px;background:#fff;color:#30252a;opacity:1;transition:opacity 420ms ease}
      .startup-splash--exiting{opacity:0;pointer-events:none}
      .startup-splash__content{display:flex;width:min(100%,340px);flex-direction:column;align-items:center;text-align:center}
      .startup-splash__logo{display:block;width:clamp(148px,28vw,196px);height:auto;aspect-ratio:1;object-fit:contain;animation:startup-logo-enter 700ms cubic-bezier(.2,.7,.25,1) both}
      .startup-splash__message{margin:22px 0 0;color:#6d5b52;font:400 13px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:.01em}
      .startup-splash__progress{position:relative;display:block;width:116px;height:2px;margin-top:20px;overflow:hidden;border-radius:999px;background:#eee9e7}
      .startup-splash__progress span{position:absolute;inset:0 auto 0 -42%;width:40%;border-radius:inherit;background:#70283f;animation:startup-progress 1.5s ease-in-out infinite}
      .startup-splash__error{max-width:360px;margin:0;color:#5b4a4f;font:400 13px/1.6 'Plus Jakarta Sans',system-ui,sans-serif;text-align:center}
      .startup-splash__actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px}
      .startup-splash__button{min-height:42px;padding:9px 16px;border:1px solid #70283f;border-radius:8px;background:#fff;color:#70283f;font:600 13px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer}
      .startup-splash__button--primary{background:#70283f;color:#fff}
      @keyframes startup-logo-enter{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
      @keyframes startup-progress{from{transform:translateX(0)}to{transform:translateX(360%)}}
      @media(max-width:640px){.startup-splash{padding:20px}.startup-splash__logo{width:clamp(144px,44vw,176px)}.startup-splash__message{margin-top:18px}.startup-splash__progress{margin-top:17px}}
      @media(max-height:560px){.startup-splash__logo{width:min(34vh,160px)}.startup-splash__message{margin-top:12px}.startup-splash__progress{margin-top:12px}}
      @media(prefers-reduced-motion:reduce){.startup-splash,.startup-splash__logo{transition:none;animation:none}.startup-splash__progress span{left:29%;width:42%;animation:none}}
    </style>
  </head>
  <body class="bg-surface-50 text-ink antialiased selection:bg-primary selection:text-white">
    <div id="root">
      <div id="startup-splash-static" class="startup-splash" role="status" aria-live="polite" aria-label="Preparando o site Salencar">
        <div class="startup-splash__content">
          <img class="startup-splash__logo" src="/images/logo.jpg" alt="Salencar Batidas Artesanais" fetchpriority="high" />
          <p class="startup-splash__message">Preparando sua experiência...</p>
          <span class="startup-splash__progress" aria-hidden="true"><span></span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.setTimeout(() => {
        const splash = document.getElementById('startup-splash-static');
        if (!splash) return;
        splash.setAttribute('role', 'alert');
        splash.setAttribute('aria-label', 'Não foi possível iniciar o site Salencar');
        splash.innerHTML = '<div class="startup-splash__content"><img class="startup-splash__logo" src="/images/logo.jpg" alt="Salencar Batidas Artesanais"><div class="startup-splash__actions"><p class="startup-splash__error">N&#227;o foi poss&#237;vel iniciar o site. Verifique sua conex&#227;o e tente novamente.</p><button class="startup-splash__button startup-splash__button--primary" onclick="window.location.reload()">Tentar novamente</button></div></div>';
      }, 15000);
    </script>
  </body>
</html>
